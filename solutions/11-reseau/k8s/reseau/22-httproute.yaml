# 90 % des requêtes vers front, 10 % vers front-canary : impossible avec l'API Ingress standard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cordee-beta
  namespace: cordee
spec:
  parentRefs:
    - name: cordee
  hostnames: ["beta.cordee.lab"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: front
          port: 8080
          weight: 90
        - name: front-canary
          port: 8080
          weight: 10
