# https://huiteo.lab : Traefik termine le TLS avec le certificat du Secret huiteo-tls
# (créé au TP 11 avec openssl, il n'est pas dans Git).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: huiteo
  namespace: huiteo
  labels:
    partie-de: huiteo
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["huiteo.lab"]
      secretName: huiteo-tls
  rules:
    - host: huiteo.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front
                port:
                  number: 8080
