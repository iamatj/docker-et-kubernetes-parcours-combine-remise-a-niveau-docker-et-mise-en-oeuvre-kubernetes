# Le mot de passe vient du Secret. Les données sont encore dans un emptyDir (TP 09).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cordee
  labels:
    partie-de: cordee
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: donnees
        partie-de: cordee
    spec:
      containers:
        - name: postgres
          image: mirror.gcr.io/library/postgres:17-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: cordee-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cordee-db
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cordee-db
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          volumeMounts:
            - name: donnees
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: donnees
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cordee
  labels:
    partie-de: cordee
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
