# Le site exposé par une adresse externe que MetalLB donne au Service (10.10.0.201).
apiVersion: v1
kind: Service
metadata:
  name: front-lb
  namespace: huiteo
  annotations:
    metallb.io/loadBalancerIPs: 10.10.0.201
spec:
  type: LoadBalancer
  selector:
    app: front
  ports:
    - port: 80
      targetPort: 8080
