<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huiteo RDV · Prenez rendez-vous avec votre notaire</title>
<style>
  :root { --encre:#1F2A44; --papier:#F4F6F8; --gris:#5B6676; --accent:#2E7D6B; --alerte:#E4572E; --carte:#FFFFFF; }
  body.v11 { --accent:#3E8EDE; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--papier); color:var(--encre); }
  header { background:var(--encre); color:var(--papier); padding:20px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  header h1 { margin:0; font-size:26px; letter-spacing:.5px; }
  header h1 span { color:var(--accent); }
  #bandeau { background:var(--accent); color:#fff; padding:10px 24px; font-weight:600; }
  main { max-width:960px; margin:0 auto; padding:24px 16px; display:grid; gap:24px; }
  .grille { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
  .etude { background:var(--carte); border-radius:10px; padding:16px; border-left:6px solid var(--accent); }
  .etude h3 { margin:0 0 6px; font-size:17px; }
  .etude p { margin:2px 0; color:var(--gris); font-size:14px; }
  form, .liste { background:var(--carte); border-radius:10px; padding:16px; }
  form { display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); align-items:end; }
  label { font-size:13px; color:var(--gris); display:grid; gap:4px; }
  input, select, button { font:inherit; padding:8px; border:1px solid #C9CFD6; border-radius:6px; }
  button { background:var(--alerte); color:#fff; border:0; cursor:pointer; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { text-align:left; padding:6px; border-bottom:1px solid #E3E7EB; }
  footer { text-align:center; color:var(--gris); font-size:12px; padding:16px; }
  .erreur { color:var(--alerte); font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>Huit<span>eo</span> RDV</h1>
  <div>Prenez rendez-vous avec votre notaire</div>
</header>
<div id="bandeau">Chargement…</div>
<main>
  <section>
    <h2>Les études</h2>
    <div class="grille" id="etudes"></div>
  </section>
  <section>
    <h2>Prendre rendez-vous</h2>
    <form id="formulaire">
      <label>Étude <select id="etude" required></select></label>
      <label>Votre nom <input id="nom" required maxlength="80"></label>
      <label>Le <input id="jour" type="date" required></label>
      <label>Personnes <input id="personnes" type="number" min="1" max="12" value="2" required></label>
      <button type="submit">Réserver le créneau</button>
    </form>
    <p id="resultat"></p>
  </section>
  <section class="liste">
    <h2>Derniers rendez-vous</h2>
    <table><thead><tr><th>N°</th><th>Étude</th><th>Nom</th><th>Jour</th><th>Pers.</th></tr></thead><tbody id="rendez-vous"></tbody></table>
  </section>
</main>
<footer id="pied">Huiteo RDV</footer>
<script>
const esc = (t) => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function json(url, options) {
  const r = await fetch(url, options);
  if (!r.ok) throw new Error(url + " : HTTP " + r.status);
  return r.json();
}
async function charger() {
  let versionFront = "?";
  try { versionFront = (await (await fetch("/version.txt")).text()).trim(); } catch (e) {}
  if (versionFront.startsWith("1.1")) document.body.classList.add("v11");
  try {
    const info = await json("/api/info");
    document.getElementById("bandeau").textContent = info.message;
    document.getElementById("pied").textContent =
      "Huiteo RDV · site " + versionFront + " · API " + info.version + " · servi par " + info.hote;
  } catch (e) {
    document.getElementById("bandeau").innerHTML = '<span>API injoignable</span>';
    document.getElementById("pied").textContent = "Huiteo RDV · site " + versionFront + " · " + e.message;
    return;
  }
  const etudes = await json("/api/etudes");
  document.getElementById("etudes").innerHTML = etudes.map(e =>
    `<div class="etude"><h3>${e.nom}</h3><p>${e.ville} · ${e.notaires} notaires</p>` +
    `<p>${e.pris} / ${e.creneaux} créneaux pris</p></div>`).join("");
  document.getElementById("etude").innerHTML = etudes.map(e => `<option value="${e.id}">${e.nom}</option>`).join("");
  const rdv = await json("/api/rendez-vous");
  document.getElementById("rendez-vous").innerHTML = rdv.map(r =>
    `<tr><td>${r.id}</td><td>${r.etude}</td><td>${esc(r.nom)}</td><td>${r.jour}</td><td>${r.personnes}</td></tr>`).join("");
}
document.getElementById("formulaire").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const sortie = document.getElementById("resultat");
  try {
    const r = await json("/api/rendez-vous", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        etude_id: Number(document.getElementById("etude").value),
        nom: document.getElementById("nom").value,
        jour: document.getElementById("jour").value,
        personnes: Number(document.getElementById("personnes").value),
      }),
    });
    sortie.className = ""; sortie.textContent = "Rendez-vous n° " + r.id + " enregistré.";
    charger();
  } catch (e) { sortie.className = "erreur"; sortie.textContent = "Échec : " + e.message; }
});
charger();
</script>
</body>
</html>
