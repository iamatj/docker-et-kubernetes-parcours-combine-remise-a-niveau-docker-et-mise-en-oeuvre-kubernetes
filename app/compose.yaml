# Cordée en local : la base, l'API et le site, sur deux réseaux séparés.
name: cordee

services:
  db:
    image: mirror.gcr.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: cordee
      POSTGRES_USER: cordee
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-moi}
    volumes:
      - donnees-db:/var/lib/postgresql/data
    networks: [arriere]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cordee -d cordee"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./api
      args:
        APP_VERSION: "1.0"
    image: cordee-api:1.0
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:-change-moi}
      MESSAGE_ACCUEIL: "Bienvenue sur Cordée (Compose)"
    tmpfs:
      - /tmp
    networks: [arriere, avant]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  front:
    build:
      context: ./front
      args:
        APP_VERSION: "1.0"
    image: cordee-front:1.0
    ports:
      - "8080:8080"
    networks: [avant]
    depends_on:
      - api
    restart: unless-stopped

networks:
  avant:
  arriere:

volumes:
  donnees-db:
