# Publie les images de Cordée sur ghcr.io : versions 1.0 et 1.1.
# La version 1.2 n'est jamais publiée : elle sert de panne au TP 07.
name: images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/images.yml"]

permissions:
  contents: read
  packages: write

jobs:
  publier:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        composant: [api, front]
        version: ["1.0", "1.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nom de l'image en minuscules
        id: nom
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cordee-${{ matrix.composant }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.composant }}
          build-args: APP_VERSION=${{ matrix.version }}
          push: true
          tags: ${{ steps.nom.outputs.image }}:${{ matrix.version }}
