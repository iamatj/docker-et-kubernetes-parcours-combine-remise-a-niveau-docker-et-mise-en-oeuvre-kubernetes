# Adresses que MetalLB peut donner aux Services de type LoadBalancer.
# 10.10.0.200 est réservée à Traefik (Ingress et Gateway API).
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lab
  namespace: metallb-system
spec:
  addresses:
    - 10.10.0.200-10.10.0.220
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lab
  namespace: metallb-system
spec:
  ipAddressPools: [lab]
