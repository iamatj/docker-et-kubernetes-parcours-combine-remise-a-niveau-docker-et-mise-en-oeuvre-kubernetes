# Étape D (tp/09-stockage/README.md) : PostgreSQL en StatefulSet. Lisez-le, puis copiez-le dans k8s/10-postgres.yaml.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cordee
  labels:
    partie-de: cordee
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: donnees
        partie-de: cordee
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: mirror.gcr.io/library/postgres:17-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: cordee-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cordee-db
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cordee-db
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          volumeMounts:
            - name: donnees
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: donnees
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cordee
  labels:
    partie-de: cordee
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# Service « headless » : pas d'IP virtuelle, un nom DNS par pod (postgres-0.postgres-headless).
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: cordee
  labels:
    partie-de: cordee
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
