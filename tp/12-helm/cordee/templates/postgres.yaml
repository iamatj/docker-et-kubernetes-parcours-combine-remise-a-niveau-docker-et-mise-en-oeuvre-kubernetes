apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "cordee.labels" . | nindent 4 }}
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: donnees
        {{- include "cordee.labels" . | nindent 8 }}
      annotations:
        # Le pod redémarre si le mot de passe change.
        checksum/configuration: {{ include (print $.Template.BasePath "/configuration.yaml") . | sha256sum }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.db.image }}
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: cordee-config, key: DB_NAME } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: cordee-db, key: DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: cordee-db, key: DB_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          volumeMounts:
            - name: donnees
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: donnees
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.db.storageClass }}
        resources:
          requests:
            storage: {{ .Values.db.stockage }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "cordee.labels" . | nindent 4 }}
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  labels:
    {{- include "cordee.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
