# Squelette du Deployment et du Service de l'API (tp/06-deploiement/README.md, étape 4).
# Remplacez chaque valeur « TODO-… », puis copiez le fichier dans k8s/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cordee
spec:
  replicas: 2
  selector:
    matchLabels:
      app: TODO-etiquette            # doit être identique à l'étiquette du gabarit de pod, plus bas
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: TODO-image-de-l-api     # ghcr.io/iamatj/cordee-api, version 1.0
          env:
            - name: DB_HOST
              value: TODO-nom-du-service-postgres
            - name: DB_PASSWORD
              value: Neige-2026
            - name: MESSAGE_ACCUEIL
              value: "Bienvenue sur Cordée"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cordee
spec:
  selector:
    app: api
  ports:
    - port: TODO-port-du-service      # le site appelle http://api:8000
      targetPort: 8000
