apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cordee
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/iamatj/cordee-api:1.0
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PASSWORD
              value: Neige-2026
            - name: MESSAGE_ACCUEIL
              value: "Bienvenue sur Cordée"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cordee
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
