apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cordee
  labels:
    partie-de: cordee
  annotations:
    kubernetes.io/change-cause: "API 1.1 : durcissement (SecurityContext, ServiceAccount)"
    cordee.lab/responsable: "Karim Benali"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: back
        partie-de: cordee
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/iamatj/cordee-api:1.1
          envFrom:
            - configMapRef:
                name: cordee-config
            - secretRef:
                name: cordee-db
          env:
            - name: DELAI_DEMARRAGE
              value: "5"
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cordee
  labels:
    partie-de: cordee
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
