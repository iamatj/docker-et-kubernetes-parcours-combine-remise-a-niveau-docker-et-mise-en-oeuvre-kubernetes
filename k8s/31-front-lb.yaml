# Le site exposé par une adresse externe que MetalLB donne au Service (192.168.56.201).
apiVersion: v1
kind: Service
metadata:
  name: front-lb
  namespace: cordee
  annotations:
    metallb.io/loadBalancerIPs: 192.168.56.201
spec:
  type: LoadBalancer
  selector:
    app: front
  ports:
    - port: 80
      targetPort: 8080
