apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: cordee
  labels:
    partie-de: cordee
  annotations:
    kubernetes.io/change-cause: "site 1.0 : sondes"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
        tier: front
        partie-de: cordee
    spec:
      containers:
        - name: front
          image: ghcr.io/iamatj/cordee-front:1.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: cordee
  labels:
    partie-de: cordee
spec:
  type: NodePort
  selector:
    app: front
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
