apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: cordee
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
        - name: front
          image: ghcr.io/iamatj/cordee-front:1.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: front
  namespace: cordee
spec:
  type: NodePort
  selector:
    app: front
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
