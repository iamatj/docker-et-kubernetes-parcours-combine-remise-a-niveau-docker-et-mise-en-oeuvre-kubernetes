<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>QCM du jour 2 – Kubernetes</title>
<style>
  :root {
    --fond: #F4F6F8;
    --carte: #ffffff;
    --texte: #1b2631;
    --secondaire: #4a5a6a;
    --accent: #E4572E;
    --sombre: #1F2A44;
    --bon: #2a9d8f;
    --faux: #c0392b;
    --bord: #ded6c8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--sombre); color: #fff; padding: 28px 16px; }
  header > div, main, .actions, #score { max-width: 860px; margin: 0 auto; }
  .surtitre { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
  h1 { margin: 6px 0 8px; font-size: 30px; line-height: 1.2; }
  header p.consigne { margin: 0; color: #d7dee6; }
  main { padding: 24px 16px 8px; display: grid; gap: 16px; }
  .question { background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; padding: 18px 20px; }
  .question h2 { margin: 0 0 4px; font-size: 18px; line-height: 1.4; }
  .question .num { color: var(--accent); margin-right: 6px; }
  .question .plusieurs { margin: 0 0 8px; font-size: 14px; color: var(--secondaire); }
  label.choix { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; margin: 4px 0; border-radius: 8px; cursor: pointer; }
  label.choix:hover { background: #f4efe6; }
  label.choix input { margin-top: 5px; flex: none; }
  code { font: 15px/1.4 ui-monospace, Consolas, monospace; background: #f1ece3; padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  .corrige label.choix { cursor: default; }
  .corrige label.choix:hover { background: none; }
  label.choix.attendue { background: #e3f2ef; font-weight: 600; }
  label.choix.erreur { background: #fbe9e7; text-decoration: line-through; }
  .question.juste { border-left: 6px solid var(--bon); }
  .question.fausse { border-left: 6px solid var(--faux); }
  .verdict { font-weight: 700; margin: 10px 0 4px; }
  .juste .verdict { color: var(--bon); }
  .fausse .verdict { color: var(--faux); }
  .explication { margin: 0; color: var(--secondaire); }
  .actions { padding: 8px 16px 0; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 12px 22px; cursor: pointer; background: var(--accent); color: #fff; }
  button.secondaire { background: var(--sombre); }
  #rappel { color: var(--faux); margin: 0; }
  #score { margin: 20px auto 48px; padding: 20px 16px; background: var(--sombre); color: #fff; border-radius: 14px; text-align: center; }
  #score .note { font-size: 44px; font-weight: 800; margin: 0; }
  #score p { margin: 6px 0 0; }
</style>
</head>

  <p class="consigne">Une seule bonne réponse par question, sauf mention contraire. Le score et les explications s'affichent quand vous validez.</p>

  <p id="rappel" hidden></p>

  const $ = id => document.getElementById(id);
  const echapper = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // `code` entre accents graves
  const enrichir = s => echapper(s).replace(/`([^`]+)`/g, "<code>$1</code>");

  function afficher() {
    $("qcm").innerHTML = DONNEES.questions.map((q, i) => {
      const multiple = q.bonnes.length > 1;
      const type = multiple ? "checkbox" : "radio";
      return `<section class="question" id="q${i}">
        <h2><span class="num">${i + 1}.</span>${enrichir(q.q)}</h2>
        ${multiple ? `<p class="plusieurs">Plusieurs réponses attendues (${q.bonnes.length}).</p>` : ""}
        ${q.choix.map((c, j) => `<label class="choix" id="q${i}c${j}"><input type="${type}" name="q${i}" value="${j}"> <span>${enrichir(c)}</span></label>`).join("")}
        <div class="retour"></div>
      </section>`;
    }).join("");
  }

  function reponses(i) {
    return [...document.querySelectorAll(`input[name="q${i}"]:checked`)].map(e => Number(e.value));
  }

  function valider() {
    const vides = DONNEES.questions.filter((_, i) => reponses(i).length === 0).length;
    if (vides && $("rappel").dataset.vu !== "1") {
      $("rappel").textContent = `${vides} question(s) sans réponse. Cliquez de nouveau pour valider quand même.`;
      $("rappel").hidden = false;
      $("rappel").dataset.vu = "1";
      return;
    }
    let total = 0;
    DONNEES.questions.forEach((q, i) => {
      const r = reponses(i).sort().join(",");
      const juste = r === [...q.bonnes].sort().join(",");
      if (juste) total++;
      const bloc = $(`q${i}`);
      bloc.classList.add("corrige", juste ? "juste" : "fausse");
      q.choix.forEach((_, j) => {
        const l = $(`q${i}c${j}`);
        l.querySelector("input").disabled = true;
        if (q.bonnes.includes(j)) l.classList.add("attendue");
        else if (l.querySelector("input").checked) l.classList.add("erreur");
      });
      bloc.querySelector(".retour").innerHTML =
        `<p class="verdict">${juste ? "Bonne réponse" : (r ? "Réponse incorrecte" : "Pas de réponse")}</p>` +
        `<p class="explication">${enrichir(q.explication)}</p>`;
    });
    const n = DONNEES.questions.length;
    const message = total === n ? "Parfait !" : total >= Math.ceil(n * 0.7) ? "Bien joué : relisez les explications des questions manquées."
      : "Relisez les explications : on reprend ces points ensemble.";
    $("score").innerHTML = `<p class="note">${total} / ${n}</p><p>${message}</p>`;
    $("score").hidden = false;
    $("rappel").hidden = true;
    $("valider").hidden = true;
    $("recommencer").hidden = false;
    $("score").scrollIntoView({ behavior: "smooth" });
  }

  function recommencer() {
    afficher();
    $("score").hidden = true;
    $("valider").hidden = false;
    $("recommencer").hidden = true;
    $("rappel").dataset.vu = "";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  $("valider").addEventListener("click", valider);
  $("recommencer").addEventListener("click", recommencer);
  afficher();
</script>

</html>
